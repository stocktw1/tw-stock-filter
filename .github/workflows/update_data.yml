name: 每日自動更新台股盤後數據

on:
  schedule:
    # 台灣時間週一至週五 下午 16:30 (UTC 08:30) 自動執行
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 介面手動點擊執行

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 簽出專案原始碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行增量資料更新
        run: |
          python update_stock_data.py

      - name: 提交並推播最新數據
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add stockdata/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新盤後收盤數據 [$(date +'%Y-%m-%d')]" && git push)
