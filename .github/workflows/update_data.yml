name: Auto Update Daily Stock Data

on:
  schedule:
    # 每天台灣時間下午 14:30 執行 (UTC 時間 06:30)，每週一至週五
    - cron: '30 6 * * 1-5'
  workflow_dispatch: # 保留此設定，讓您可以隨時在 GitHub 網頁上手動點擊執行測試

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # 賦予 GitHub Actions 讀寫儲存庫的權限
    permissions:
      contents: write

    steps:
      - name: 1. 取得專案程式碼
        uses: actions/checkout@v3

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝依賴套件
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. 執行下載腳本 (產生新檔案)
        run: python 下載每日收盤行情.py

      - name: 5. 核心邏輯：保留最新檔案並刪除舊檔
        run: |
          # 切換到資料存放的目錄
          cd stockdata
          # ls -t : 依照檔案時間由新到舊排序
          # tail -n +2 : 跳過第 1 個 (最新產生的檔案)
          # xargs -r rm -f : 將剩餘的舊檔案強制刪除
          ls -t | tail -n +2 | xargs -r rm -f

      - name: 6. 提交並推送異動回 GitHub
        run: |
