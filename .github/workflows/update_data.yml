name: Auto Update Daily Stock Data

on:
  schedule:
    # 台灣時間每週一至週五 下午 16:30 (UTC 時間 08:30) 自動執行 (確保盤後數據已結算)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行測試

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # 賦予 GitHub Actions 讀寫儲存庫的權限
    permissions:
      contents: write

    steps:
      - name: 1. 取得專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. 執行盤後數據自動增量更新與清理舊檔
        run: python update_stock_data.py

      - name: 5. 提交並推送異動回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # 使用 -A 確保 Git 完整捕捉到「新檔增加」與「舊檔刪除」兩種狀態
          git add -A stockdata/
          # 若資料無變動則跳過 commit，避免 workflow 報錯
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新台股盤後收盤數據與清理舊檔 [$(date +'%Y-%m-%d')]" && git push)
